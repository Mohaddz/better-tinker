name: Release (build binaries + publish to PyPI)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install hatch

      - name: Build Go binaries into better_tinker/bin
        run: |
          python build_binaries.py
          chmod +x better_tinker/bin/tinker-cli-linux || true
          chmod +x better_tinker/bin/tinker-cli-darwin || true
          chmod +x better_tinker/bin/tinker-cli-darwin-arm64 || true

      - name: Build Python package (wheel + sdist)
        run: |
          hatch build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

